name: 部署官网与论坛到服务器

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 48407 202.181.26.190 >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步官网文件
        run: |
          rsync -az --delete --exclude '.git' --exclude '.github' --exclude 'forum' ./ deploy@202.181.26.190:/var/www/blockbox/ -e "ssh -p 48407"

      - name: 同步论坛代码
        run: |
          rsync -az --delete --exclude 'data' --exclude '.env' --exclude '.git' forum/ deploy@202.181.26.190:/opt/blockbox-forum/ -e "ssh -p 48407"

      - name: 重启论坛服务
        run: |
          ssh -p 48407 deploy@202.181.26.190 "sudo /usr/bin/systemctl restart blockbox-forum && sleep 2 && systemctl is-active blockbox-forum"

      - name: 验证部署
        run: |
          ok=1
          for i in 1 2 3 4 5; do
            code1=$(curl -s -o /dev/null -w '%{http_code}' https://blockbox.cc.cd/)
            code2=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: forum.blockbox.cc.cd' http://202.181.26.190/)
            echo "官网:$code1 论坛:$code2 (第${i}次)"
            if [ "$code1" = 200 ] && [ "$code2" = 200 ]; then ok=0; break; fi
            sleep 5
          done
          test $ok = 0
