name: 部署官网与论坛到服务器

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 48407 202.181.26.190 >> ~/.ssh/known_hosts 2>/dev/null

      - name: 同步官网文件
        run: |
          rsync -az --delete --exclude '.git' --exclude '.github' --exclude 'forum' ./ deploy@202.181.26.190:/var/www/blockbox/ -e "ssh -p 48407"

      - name: 让论坛服务能写首页公告
        run: |
          # 管理后台发布公告要写回这个文件；rsync 会把属主重置成 deploy，这里交还给论坛服务。
          # 失败只提示、不拦住部署，后台会显示「公告文件不可写」，按部署文档修一下即可。
          ssh -p 48407 deploy@202.181.26.190 "sudo -n chown www-data:www-data /var/www/blockbox/announcement.json || echo '警告：公告文件属主没改成功，管理后台可能无法发布公告'"

      - name: 同步论坛代码
        run: |
          rsync -az --delete --exclude 'data' --exclude '.env' --exclude '.git' forum/ deploy@202.181.26.190:/opt/blockbox-forum/ -e "ssh -p 48407"

      - name: 允许论坛服务写官网目录
        run: |
          # systemd 的 ProtectSystem=strict 默认不让写官网目录；用 drop-in 把公告目录加进白名单
          # （与 deploy/blockbox-forum-announcement.conf 内容一致）。失败只提示，不拦部署。
          ssh -p 48407 deploy@202.181.26.190 "sudo -n mkdir -p /etc/systemd/system/blockbox-forum.service.d && printf '%s\n' '[Service]' 'ReadWritePaths=/var/www/blockbox' | sudo -n tee /etc/systemd/system/blockbox-forum.service.d/announcement.conf >/dev/null && sudo -n systemctl daemon-reload" || echo '警告：公告目录可写配置没装上，管理后台可能无法发布公告'

      - name: 重启论坛服务
        run: |
          ssh -p 48407 deploy@202.181.26.190 "sudo /usr/bin/systemctl restart blockbox-forum && sleep 2 && systemctl is-active blockbox-forum"

      - name: 验证部署
        run: |
          ok=1
          for i in 1 2 3 4 5; do
            code1=$(curl -s -o /dev/null -w '%{http_code}' https://mcblockbox.top/)
            code2=$(curl -s -o /dev/null -w '%{http_code}' https://forum.mcblockbox.top/)
            echo "官网:$code1 论坛:$code2 (第${i}次)"
            if [ "$code1" = 200 ] && [ "$code2" = 200 ]; then ok=0; break; fi
            sleep 5
          done
          test $ok = 0
