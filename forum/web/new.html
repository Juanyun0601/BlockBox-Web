<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发帖 · 方块盒子论坛</title>
<meta name="description" content="在方块盒子论坛发表新主题">
<link rel="icon" href="/assets/img/icon.ico">
<link rel="stylesheet" href="/assets/forum.css?v=20261107a">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('bbf-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  })();
</script>
</head>
<body data-page="new">
<div id="siteNav"></div>

<main class="page">
  <div class="wrap" style="max-width: 820px">
    <div class="crumbs"><a href="/">首页</a><span>›</span><span>发新帖</span></div>
    <div id="newHost">
      <div class="card composer">
        <h3>发新帖</h3>
        <div id="formError"></div>
        <div class="field">
          <label for="boardSelect">发到哪个板块 <span class="req">*</span></label>
          <select class="select" id="boardSelect"></select>
        </div>
        <div class="field">
          <label for="titleInput">标题 <span class="req">*</span></label>
          <input class="input" id="titleInput" maxlength="80" placeholder="一句话说清问题或想聊的内容">
          <div class="input-hint">2–80 个字。求助请写清现象，比如「1.20.4 启动报 Java 找不到」。</div>
        </div>
        <div class="field">
          <label for="tagInput">标签（可选，最多 4 个）</label>
          <div class="tag-input-wrap" id="tagWrap">
            <input id="tagInput" maxlength="12" placeholder="输入后按空格或回车，例如：优化、整合包">
          </div>
          <div class="input-hint">标签会显示在帖子上，点标签能看到同类主题。</div>
        </div>
        <div class="field">
          <label for="contentInput">正文 <span class="req">*</span></label>
          <textarea class="textarea textarea-lg" id="contentInput" placeholder="详细描述一下…&#10;&#10;支持 Markdown：**加粗**、`代码`、> 引用、- 列表、[链接](https://…)；输入 @ 可以选人，也能直接粘贴或拖入图片"></textarea>
        </div>
        <div class="composer-foot">
          <span class="muted">发帖前可以先用搜索看看有没有同类问题</span>
          <span class="composer-count" id="contentCount">0 字</span>
          <a class="btn btn-ghost btn-sm" href="/search.html">去搜索</a>
          <button class="btn btn-primary" id="submitBtn">发布</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer" id="siteFooter"></footer>
<script src="/assets/core.js?v=20261107a"></script>
<script src="/assets/page-new.js?v=20261106c"></script>
</body>
</html>
