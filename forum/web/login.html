<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 / 注册 · 方块盒子论坛</title>
<meta name="description" content="登录方块盒子论坛，参与玩家讨论">
<link rel="icon" href="/assets/img/icon.ico">
<script src="/assets/i18n.js?v=20261119a"></script>
<link rel="stylesheet" href="/assets/forum.css?v=20261121b">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('bbf-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  })();
</script>
</head>
<body data-page="login">
<div id="siteNav"></div>

<main class="page">
  <div class="wrap">
    <div class="auth-wrap">
      <div class="card auth-card">
        <h1 id="authTitle">登录方块盒子论坛</h1>
        <p id="authSub">用你注册的账号继续参与讨论。</p>

        <div class="auth-tabs">
          <button type="button" data-tab="login" class="active">登录</button>
          <button type="button" data-tab="register">注册新账号</button>
        </div>

        <div id="authError"></div>
        <div id="authNotice"></div>

        <form id="authForm" autocomplete="on">
          <div class="field">
            <label for="username">用户名</label>
            <input class="input" id="username" name="username" maxlength="20" autocomplete="username" placeholder="中文、字母、数字，2–20 位">
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="至少 6 位">
          </div>
          <div class="field hidden" id="confirmField">
            <label for="confirm">确认密码</label>
            <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="再输一次">
          </div>
          <div class="field hidden" id="emailField">
            <label for="email">邮箱 <span class="req">*</span></label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" maxlength="120" placeholder="要收验证码，请填常用邮箱">
          </div>
          <div class="field hidden" id="codeField">
            <label for="code">邮箱验证码 <span class="req">*</span></label>
            <div class="code-row">
              <input class="input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位数字">
              <button class="btn btn-ghost" type="button" id="sendCodeBtn">发送验证码</button>
            </div>
            <div class="input-hint" id="codeHint">验证码 10 分钟内有效；没收到就看看垃圾邮件箱。</div>
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="submitBtn">登录</button>
        </form>

        <div class="auth-divider" id="oauthDivider"><span>或使用第三方账号</span></div>
        <div class="oauth-buttons" id="oauthButtons"></div>
        <p class="oauth-hint" id="oauthHint">首次使用会自动创建方块盒子账号；已经登录时则直接绑定到当前账号。</p>

        <div class="auth-note">注册即表示你愿意守点规矩：友善提问、不刷屏、不发广告。</div>
      </div>
    </div>
  </div>
</main>

<footer class="footer" id="siteFooter"></footer>
<script src="/assets/core.js?v=20261120c"></script>
<script src="/assets/page-auth.js?v=20261121b"></script>
</body>
</html>
