<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索 · 方块盒子论坛</title>
<meta name="description" content="搜索方块盒子论坛的主题与回复">
<link rel="icon" href="/assets/img/icon.ico">
<link rel="stylesheet" href="/assets/forum.css?v=20261114a">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('bbf-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  })();
</script>
</head>
<body data-page="search">
<div id="siteNav"></div>

<main class="page">
  <div class="wrap" style="max-width: 860px">
    <form class="card" id="searchForm" style="padding: 18px 20px; display: flex; gap: 10px">
      <input class="input" id="searchInput" type="search" name="q" placeholder="搜标题和正文，中文两个字也能搜" aria-label="搜索关键词">
      <button class="btn btn-primary" type="submit">搜索</button>
    </form>

    <div class="section-head" style="margin-top: 22px">
      <h2 id="resultTitle">搜索结果</h2>
      <span class="small muted" id="resultCount" style="margin-left: auto"></span>
    </div>

    <div class="card thread-list" id="resultList">
      <div class="skeleton">输入关键词开始搜索</div>
    </div>

    <div id="pager"></div>
  </div>
</main>

<footer class="footer" id="siteFooter"></footer>
<script src="/assets/core.js?v=20261114a"></script>
<script src="/assets/page-search.js?v=20261101a"></script>
</body>
</html>
