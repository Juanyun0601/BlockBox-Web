<script>
  (function () {
    try {
      var saved = localStorage.getItem('bbf-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  })();
</script>
<style>
  /* ---------------- 联机分享链接页 ---------------- */

  .join-page {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 34px 0 38px;
    background:
      radial-gradient(46% 42% at 50% -4%, rgba(76, 175, 80, 0.18), transparent 72%),
      radial-gradient(24% 26% at 88% 4%, rgba(124, 194, 66, 0.13), transparent 70%);
    background-repeat: no-repeat;
  }

  [data-theme="dark"] .join-page {
    background:
      radial-gradient(46% 42% at 50% -4%, rgba(102, 187, 106, 0.14), transparent 72%),
      radial-gradient(24% 26% at 88% 4%, rgba(102, 187, 106, 0.07), transparent 70%);
    background-repeat: no-repeat;
  }

  .join-wrap {
    width: 100%;
    max-width: 540px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* 页面自己的小品牌头：分享页不挂全站导航，给一张「我是谁」的条 */
  .join-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 2px 14px;
  }

  .join-mark {
    width: 32px;
    height: 32px;
    flex: none;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: #fff;
    background: linear-gradient(145deg, var(--g500), var(--g800));
    box-shadow: 0 6px 14px rgba(46, 125, 50, 0.28);
  }

  .join-brand-name {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }

  .join-brand-name em {
    font-style: normal;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-3);
    margin-left: 6px;
    letter-spacing: 0;
  }

  .join-brand-link {
    margin-left: auto;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-3);
    transition: background 0.18s, color 0.18s;
    white-space: nowrap;
  }

  .join-brand-link:hover { color: var(--brand); background: var(--brand-soft); }

  /* 邀请卡：上绿下白，整页的主角 */
  .invite-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 48px -28px rgba(23, 37, 26, 0.34), 0 2px 6px rgba(23, 37, 26, 0.05);
  }

  [data-theme="dark"] .invite-card {
    border-color: var(--line-2);
    box-shadow: 0 24px 48px -22px rgba(0, 0, 0, 0.6);
  }

  .invite-banner {
    position: relative;
    padding: 22px 24px 20px;
    color: #fff;
    overflow: hidden;
    background:
      radial-gradient(110% 140% at 92% -32%, rgba(255, 255, 255, 0.26), transparent 60%),
      linear-gradient(135deg, #296b2e 0%, #337d36 52%, #3a8837 100%);
  }

  /* 底部压一层暗角，白色小字不会被渐变最亮处吃掉 */
  .invite-banner::before {
    content: "";
    position: absolute;
    z-index: 0;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, 0.14) 100%);
  }

  /* 淡淡的方块网格，呼应方块盒子，别抢文字 */
  .invite-banner::after {
    content: "";
    position: absolute;
    z-index: 0;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(130% 120% at 100% 0%, #000 0%, transparent 68%);
    mask-image: radial-gradient(130% 120% at 100% 0%, #000 0%, transparent 68%);
  }

  .invite-eyebrow {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    padding: 3px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.32);
    background: rgba(255, 255, 255, 0.16);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .invite-eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #d8ffa6;
    box-shadow: 0 0 0 3px rgba(216, 255, 166, 0.26);
  }

  .invite-room {
    position: relative;
    z-index: 1;
    font-size: 21px;
    line-height: 1.4;
    font-weight: 800;
    letter-spacing: -0.3px;
    word-break: break-word;
  }

  .invite-sub {
    position: relative;
    z-index: 1;
    margin-top: 6px;
    font-size: 13.5px;
    line-height: 1.65;
    color: rgba(255, 255, 255, 0.9);
  }

  /* 房主写的一句介绍：比副标题更大更亮，进房前先了解这个服怎么玩 */
  .invite-desc {
    position: relative;
    z-index: 1;
    margin-top: 8px;
    font-size: 13.5px;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.96);
    background: rgba(0, 0, 0, 0.14);
    border-left: 3px solid rgba(216, 255, 166, 0.75);
    border-radius: 0 8px 8px 0;
    padding: 7px 10px;
    word-break: break-word;
  }

  .invite-body {
    display: flex;
    flex-direction: column;
    gap: 13px;
    padding: 16px 24px 20px;
  }

  /* 版本 / 加载器 / 模组这类小标签 */
  .invite-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .invite-chip {
    display: inline-flex;
    align-items: center;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    background: var(--card-2);
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }

  .invite-chip-core {
    color: var(--brand);
    background: var(--brand-soft);
    border-color: var(--brand-line);
    font-weight: 700;
  }

  .invite-code-head {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 8px;
    margin-bottom: 7px;
  }

  .invite-code-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-2);
  }

  .invite-code-hint {
    font-size: 11.5px;
    color: var(--ink-3);
  }

  .invite-code-box {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    padding: 11px 11px 11px 16px;
    border-radius: 14px;
    border: 1px solid var(--brand-line);
    background: var(--bg-tint);
  }

  .invite-code {
    flex: 1;
    min-width: 0;
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: 0.06em;
    color: var(--brand);
    word-break: break-all;
    user-select: all;
    cursor: pointer;
  }

  /* 陶瓦邀请码（U/XXXX-XXXX-…）和常见域名端口都不算短，压一档刚好一行放下 */
  .invite-code.is-mid {
    font-size: 16px;
    letter-spacing: 0.01em;
    line-height: 1.5;
  }

  /* 特别长的地址允许折行，不再撑破卡片 */
  .invite-code.is-long {
    font-size: 13px;
    letter-spacing: 0;
    line-height: 1.6;
    word-break: normal;
    overflow-wrap: anywhere;
  }

  .invite-copy {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 34px;
    padding: 0 11px;
    border-radius: 10px;
    border: 1px solid var(--line-2);
    background: var(--card);
    color: var(--ink-2);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
  }

  .invite-copy:hover { border-color: var(--brand-line); color: var(--brand); }

  /* 复制成功后把图标换成对勾，比只改文字更好认 */
  .invite-copy-check { display: none; }
  .invite-copy.is-done .invite-copy-icon { display: none; }
  .invite-copy.is-done .invite-copy-check { display: block; }

  .invite-copy.is-done {
    color: #fff;
    border-color: var(--g800);
    background: var(--g800);
  }

  [data-theme="dark"] .invite-copy.is-done {
    color: #08210b;
    border-color: var(--g600);
    background: var(--g600);
  }

  .invite-mods {
    font-size: 12px;
    line-height: 1.65;
    color: var(--ink-3);
    word-break: break-word;
  }

  .invite-mods b {
    margin-right: 2px;
    color: var(--ink-2);
    font-weight: 700;
  }

  .invite-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 50px;
    margin-top: 2px;
    border-radius: 14px;
    color: #fff;
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: 0.2px;
    background: linear-gradient(180deg, #388d3c 0%, #2e7d32 55%, #296f2d 100%);
    box-shadow: 0 12px 24px -12px rgba(46, 125, 50, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    transition: filter 0.18s, transform 0.15s, box-shadow 0.2s;
  }

  .invite-cta:hover { filter: brightness(1.05); }

  .invite-cta:active {
    transform: translateY(1px);
    box-shadow: 0 6px 14px -10px rgba(46, 125, 50, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.16);
  }

  [data-theme="dark"] .invite-cta {
    color: #08210b;
    background: linear-gradient(180deg, #6ac46e 0%, #4caf50 55%, #3f9a43 100%);
    box-shadow: 0 14px 26px -14px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }

  .invite-cta svg { flex: none; }

  .invite-alt {
    font-size: 12.5px;
    text-align: center;
    color: var(--ink-2);
  }

  .invite-alt a,
  .invite-fallback a {
    color: var(--brand);
    font-weight: 700;
    text-decoration: underline;
    text-decoration-color: var(--brand-line);
    text-underline-offset: 2px;
  }

  .invite-fallback {
    display: none;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--warn-soft);
    color: var(--warn);
    font-size: 12.5px;
    line-height: 1.7;
  }

  .invite-fallback.show { display: block; }

  .invite-fallback a { color: inherit; text-decoration-color: currentColor; }

  .invite-note {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--ink-3);
  }

  .invite-note svg { flex: none; margin-top: 3px; }

  /* 查看房主资源按钮：一行居中的次要动作，别抢「一键加入」的戏 */
  .invite-res-btn {
    display: inline-flex;
    align-items: center;
    align-self: center;
    gap: 6px;
    height: 34px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1px solid var(--line-2);
    background: var(--card-2);
    color: var(--ink-2);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
  }

  .invite-res-btn:hover {
    border-color: var(--brand-line);
    color: var(--brand);
    background: var(--brand-soft);
  }

  .invite-res-btn svg { flex: none; }

  /* 房主资源清单：居中弹窗 */
  .join-modal {
    position: fixed;
    z-index: 90;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }

  .join-modal[hidden] { display: none; }

  .join-modal-mask {
    position: absolute;
    inset: 0;
    background: rgba(15, 22, 17, 0.42);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }

  .join-modal-card {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(540px, 100%);
    max-height: min(620px, 86vh);
    border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--card);
    box-shadow: 0 28px 64px -24px rgba(15, 22, 17, 0.5);
    animation: join-modal-in 0.16s ease-out;
  }

  @keyframes join-modal-in {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }

  .join-modal-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: none;
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
  }

  .join-modal-head h2 {
    flex: 1;
    min-width: 0;
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }

  .join-modal-close {
    flex: none;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    border: 1px solid var(--line-2);
    background: var(--card-2);
    color: var(--ink-3);
    cursor: pointer;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
  }

  .join-modal-close:hover {
    color: var(--brand);
    border-color: var(--brand-line);
    background: var(--brand-soft);
  }

  .join-modal-body {
    overflow-y: auto;
    padding: 6px 18px 14px;
    overscroll-behavior: contain;
  }

  .join-modal-group { margin-top: 12px; }

  .join-modal-group-label {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-2);
  }

  .join-modal-group-label i {
    font-style: normal;
    font-weight: 700;
    font-size: 11px;
    color: var(--brand);
    background: var(--brand-soft);
    border: 1px solid var(--brand-line);
    border-radius: 999px;
    padding: 1px 8px;
  }

  .join-modal-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .join-modal-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 11px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: var(--card-2);
    color: var(--ink-2);
    font-size: 12.5px;
    line-height: 1.5;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .join-modal-item:hover {
    border-color: var(--brand-line);
    background: var(--brand-soft);
    color: var(--brand);
  }

  .join-modal-item-name {
    flex: 1;
    min-width: 0;
    word-break: break-all;
    font-weight: 600;
  }

  .join-modal-item svg { flex: none; opacity: 0.65; }
  .join-modal-item:hover svg { opacity: 1; }

  .join-modal-foot {
    flex: none;
    padding: 10px 18px 14px;
    border-top: 1px dashed var(--line);
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--ink-3);
  }

  body.join-modal-open { overflow: hidden; }

  .join-modal-card:focus-visible,
  .invite-res-btn:focus-visible,
  .join-modal-close:focus-visible,
  .join-modal-item:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  @media (max-width: 560px) {
    .join-modal { padding: 14px 10px; }
    .join-modal-head { padding: 14px 14px 10px; }
    .join-modal-body { padding: 4px 14px 10px; }
    .join-modal-foot { padding: 9px 14px 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .join-modal-card { animation: none; }
    .invite-res-btn, .join-modal-close, .join-modal-item { transition: none; }
  }

  /* 打不开链接时的样子 */
  .invite-error {
    padding: 38px 26px 32px;
    text-align: center;
  }

  .invite-error-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 14px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    background: var(--warn-soft);
    color: var(--warn);
  }

  .invite-error h2 {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }

  .invite-error p {
    margin: 8px 0 20px;
    font-size: 13px;
    line-height: 1.75;
    color: var(--ink-2);
    word-break: break-word;
  }

  .invite-error-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* 卡片下面的三步说明与页脚 */
  .join-steps {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 12px;
    list-style: none;
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--ink-2);
  }

  .join-steps li {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .join-steps li + li::before {
    content: "";
    width: 12px;
    height: 1px;
    margin-right: 2px;
    background: var(--line-2);
  }

  .join-step-num {
    width: 18px;
    height: 18px;
    flex: none;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1px solid var(--brand-line);
    background: var(--brand-soft);
    color: var(--brand);
    font-size: 11px;
    font-weight: 800;
  }

  .join-footer {
    margin-top: 14px;
    text-align: center;
    font-size: 11.5px;
    line-height: 1.9;
    color: var(--ink-3);
  }

  .join-footer a { color: var(--ink-3); }
  .join-footer a:hover { color: var(--brand); }
  .join-footer .dot { margin: 0 6px; opacity: 0.6; }

  .join-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* 解析中的骨架屏 */
  .sk {
    display: block;
    border-radius: 8px;
    background-image: linear-gradient(90deg, rgba(127, 127, 127, 0.1) 25%, rgba(127, 127, 127, 0.19) 37%, rgba(127, 127, 127, 0.1) 63%);
    background-size: 400% 100%;
    animation: join-sk 1.4s ease-in-out infinite;
  }

  .invite-banner .sk {
    background-image: linear-gradient(90deg, rgba(255, 255, 255, 0.18) 25%, rgba(255, 255, 255, 0.4) 37%, rgba(255, 255, 255, 0.18) 63%);
  }

  .sk-eyebrow { width: 104px; height: 20px; border-radius: 999px; }
  .sk-title { width: 62%; height: 22px; margin-top: 12px; }
  .sk-sub { width: 82%; height: 12px; margin-top: 10px; border-radius: 6px; }
  .sk-chip { width: 88px; height: 24px; border-radius: 999px; }
  .sk-chip-sm { width: 64px; }
  .sk-head { width: 132px; height: 12px; border-radius: 6px; margin-top: 3px; }
  .sk-code { width: 100%; height: 58px; border-radius: 14px; }
  .sk-cta { width: 100%; height: 50px; border-radius: 14px; }

  @keyframes join-sk {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  .invite-cta:focus-visible,
  .invite-copy:focus-visible,

<script>
(function () {
  'use strict';

  var DOWNLOAD_URL = 'https://mcblockbox.top/download.html';
  var panel = document.getElementById('joinPanel');
  var steps = document.getElementById('joinSteps');
  var status = document.getElementById('joinStatus');

  // 与客户端 ForumLobbyService::coreDisplayName 保持一致
  var CORE_LABELS = {
    terracotta: '陶瓦联机',
    hongshi: '红石联机',
    frp: '内网穿透',
    custom: '直连'
  };

  /** core.js 没加载成功时也要能转义，页面不至于整页空着 */
  function esc(value) {
    var text = String(value == null ? '' : value);
    if (window.BB && BB.esc) return BB.esc(text);
    return text.replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function announce(message) {
    if (status) status.textContent = message || '';
  }

  function payloadParam() {
    try {
      var value = new URLSearchParams(location.search).get('d');
      if (value) return value;
    } catch (e) { /* 老浏览器走下面的正则 */ }
    var match = /[?&]d=([^&]+)/.exec(location.search);
    return match ? match[1] : '';
  }

  /** 新式短链接里的房间号（join.html?r=房间号） */
  function shareParam() {
    try {
      var value = new URLSearchParams(location.search).get('r');
      if (value) return value.trim();
    } catch (e) { /* 老浏览器走下面的正则 */ }
    var match = /[?&]r=([^&]+)/.exec(location.search);
    return match ? decodeURIComponent(match[1]).trim() : '';
  }

  /**
   * 按房间号从论坛服务器取房间信息。
   * 拿不到（房主已经结束联机 / 放太久失效）就抛出 gone=true，页面显示「联机可能已经结束」。
   */
  function fetchShare(token) {
    var url = '/api/lobby/shares/' + encodeURIComponent(token);
    return fetch(url, {
      headers: { Accept: 'application/json' },
      credentials: 'same-origin',
      cache: 'no-store'
    }).then(function (resp) {
      if (resp.status === 403) {
        // 人机验证过期了：先去过滑块，回来接着打开这条邀请
        return resp.json().catch(function () { return {}; }).then(function (body) {
          if (body && body.code === 'human_required') {
            location.replace('/verify.html?next=' +
              encodeURIComponent(location.pathname + location.search));
            return new Promise(function () { /* 页面马上要跳走 */ });
          }
          throw new Error('request_failed');
        });
      }
      if (resp.status === 404) {
        var gone = new Error('gone');
        gone.gone = true;
        throw gone;
      }
      if (!resp.ok) throw new Error('request_failed');
      return resp.json();
    }).then(function (body) {
      var share = body && body.share;
      if (!share || !share.c || (!share.ic && !share.ad)) {
        var gone = new Error('gone');
        gone.gone = true;
        throw gone;
      }
      return share;
    });
  }

  // 解客户端 qCompress 载荷：base64url → 字节 → 去掉 4 字节大端长度头 → zlib inflate
  function decodePayload(param) {
    var broken = new Error('邀请内容不完整或已损坏，请让房主重新创建分享链接。');
    if (typeof DecompressionStream === 'undefined') {
      return Promise.reject(new Error('当前浏览器版本过旧，暂时打不开邀请链接，升级浏览器或换一个再试。'));
    }
    var b64 = param.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bytes;
    try {
      var bin = atob(b64);
      bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      if (bytes.length <= 4) throw broken;
    } catch (e) {
      return Promise.reject(broken);
    }
    var stream;
    try {
      stream = new Blob([bytes.slice(4)]).stream().pipeThrough(new DecompressionStream('deflate'));
    } catch (e) {
      return Promise.reject(broken);
    }
    return new Response(stream).text().then(function (text) {
      var data = JSON.parse(text);
      if (!data || !data.c || (!data.ic && !data.ad)) throw broken;
      return data;
    }).catch(function (e) {
      throw (e && e.message && e.message.indexOf('邀请内容') === 0) ? e : broken;
    });
  }

  function copyText(text, onDone) {
    function done() {
      announce('已复制到剪贴板');
      if (window.BB && BB.toast) BB.toast('已复制', 'ok');
      if (onDone) onDone();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
    } else {
      legacyCopy(text, done);
    }
  }

  function legacyCopy(text, done) {
    var input = document.createElement('textarea');
    input.value = text;
    input.setAttribute('readonly', '');
    input.style.position = 'fixed';
    input.style.opacity = '0';
    document.body.appendChild(input);
    input.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* 忽略 */ }
    document.body.removeChild(input);
  }

  /** 复制按钮的「已复制 ✓」态，1.8 秒后自己退回 */
  function flashCopied(button) {
    var label = button.querySelector('.invite-copy-text');

    clearTimeout(button._joinTimer);
    button._joinTimer = setTimeout(function () {
      button.classList.remove('is-done');
      if (label) label.textContent = '复制';
      announce('');
    }, 1800);
  }

  /** 邀请码按长度挑字号：短的放大，长的压一档，超长地址再压一档并允许折行 */
  function codeSizeClass(code) {
    if (code.length > 26) return ' is-long';
    if (code.length > 12) return ' is-mid';
    return '';
  }

  /** 长地址在自己身上的 . : / - 处分行，别把域名拦腰截断 */

  /**
   * data：房间信息（新式短链接从服务器取，老式链接从 ?d= 载荷解）；

  function render(data, linkQuery) {

    var shaderPacks = Array.isArray(data.sp) ? data.sp.filter(Boolean) : [];

    // 房主装了什么：弹窗按这四组展示，空组不出现
    var resGroups = [
      { label: '模组', mrType: 'mod', names: mods },
      { label: '辅助模组', mrType: 'mod', names: auxMods },
      { label: '资源包', mrType: 'resourcepack', names: resourcePacks },
      { label: '光影包', mrType: 'shader', names: shaderPacks }
    ].filter(function (group) { return group.names.length > 0; });

    var resBtnHtml = '';
    if (resGroups.length) {
      resBtnHtml =
        '<button type="button" class="invite-res-btn" id="joinResBtn">' +
          '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8 20.5 7.5v9L12 21.2 3.5 16.5v-9z"/><path d="m3.5 7.5 8.5 4.7 8.5-4.7"/><path d="M12 12.2v9"/></svg>' +
          '<span>查看房主资源</span>' +

    document.title = title + ' · 方块盒子';

    var chips = '<span class="invite-chip invite-chip-core">' + esc(coreLabel) + '</span>';
    if (data.v) chips += '<span class="invite-chip">版本 ' + esc(data.v) + '</span>';
    if (data.ld) chips += '<span class="invite-chip">' + esc(data.ld) + '</span>';
    if (mods.length) chips += '<span class="invite-chip">' + mods.length + ' 个模组</span>';
    if (auxMods.length) chips += '<span class="invite-chip">' + auxMods.length + ' 个辅助模组</span>';
    if (resourcePacks.length) chips += '<span class="invite-chip">' + resourcePacks.length + ' 个资源包</span>';
    if (shaderPacks.length) chips += '<span class="invite-chip">' + shaderPacks.length + ' 个光影包</span>';

    var modsLine = '';
    if (mods.length) {
      var names = mods.slice(0, 3).join('、') + (mods.length > 3 ? ' 等 ' + mods.length + ' 个' : '');
      modsLine = '<p class="invite-mods"><b>模组</b>' + esc(names) + '</p>';

    // 辅助模组 / 资源包 / 光影包是「可以一起装」的可选项，客户端加房时会列成清单让用户勾选
    if (auxMods.length || resourcePacks.length || shaderPacks.length) {

      if (auxMods.length) extras.push(auxMods.length + ' 个辅助模组');

      modsLine += '<p class="invite-mods"><b>可选</b>' + esc(extras.join('、')) + '，加入时可以在客户端里勾选安装</p>';
    }

    var deepLink = 'blockbox://join?' + linkQuery;

    panel.innerHTML =
      '<div class="invite-banner">' +
        '<span class="invite-eyebrow">联机房间邀请</span>' +
        '<h1 class="invite-room">' + esc(title) + '</h1>' +
        (description ? '<p class="invite-desc">' + esc(description) + '</p>' : '') +
        '<p class="invite-sub">一起玩 Minecraft 吧，装好方块盒子就能一键进房</p>' +
      '</div>' +
      '<div class="invite-body">' +
        '<div class="invite-chips">' + chips + '</div>' +
        '<div class="invite-code-wrap">' +
          '<div class="invite-code-head">' +
            '<span class="invite-code-label">' + codeLabel + '</span>' +
            '<span class="invite-code-hint">' + codeHint + '</span>' +
          '</div>' +
          '<div class="invite-code-box">' +
            '<code class="invite-code' + codeSizeClass(code) + '" id="joinCode" title="点击复制">' + codeMarkup(code) + '</code>' +
            '<button type="button" class="invite-copy" id="joinCopyBtn" aria-label="复制' + codeLabel + '">' +
              '<svg class="invite-copy-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3h-7A2.5 2.5 0 0 0 3 5.5v7A2.5 2.5 0 0 0 5.5 15"/></svg>' +
              '<svg class="invite-copy-check" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12.5 5 5L20 6.5"/></svg>' +

            '</button>' +
          '</div>' +
        '</div>' +
        modsLine +
        resBtnHtml +
        '<a class="invite-cta" id="joinLaunchBtn" href="' + esc(deepLink) + '">' +

          '<span>通过方块盒子一键加入</span>' +
        '</a>' +
        '<p class="invite-alt">还没装方块盒子？<a href="' + DOWNLOAD_URL + '" target="_blank" rel="noopener">下载安装</a>后再点一次就行</p>' +

        '<div class="invite-note">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6h.01"/></svg>' +
          '<span>「一键加入」会自动挑最合适的本地实例；缺模组、资源包或光影包时会先问你要不要一起下载，也能逐项勾选；房主关掉房间后这个邀请就失效了。</span>' +
        '</div>' +
      '</div>';

    panel.setAttribute('aria-busy', 'false');

    var codeEl = document.getElementById('joinCode');
    var copyBtn = document.getElementById('joinCopyBtn');

    copyBtn.addEventListener('click', function () {

    codeEl.addEventListener('click', function () {
      copyText(code, function () {
        announce('已复制' + codeLabel);
        if (copyBtn) flashCopied(copyBtn);
      });
    });

    var launched = false;
    var launchBtn = document.getElementById('joinLaunchBtn');
    launchBtn.addEventListener('click', function () {
      var fallback = document.getElementById('joinFallback');
      if (fallback) fallback.classList.remove('show');

      window.addEventListener('blur', function () { launched = true; }, { once: true });

  // ---------------- 房主资源清单弹窗 ----------------

  var resModal = null;
  var resModalKeyHandler = null;
  var resModalReturnFocus = null;

  // 与客户端 LobbyContentFetcher 同一套过滤：版本号、加载器、平台词不当搜索词
  var RES_NOISE = {
    fabric: 1, forge: 1, neoforge: 1, quilt: 1, liteloader: 1, mc: 1, minecraft: 1,
    client: 1, server: 1, universal: 1, release: 1, beta: 1, alpha: 1, rc: 1,
    snapshot: 1, shaders: 1, shader: 1, resourcepack: 1, resourcepacks: 1,
    mod: 1, jar: 1, zip: 1, win: 1, windows: 1, linux: 1, mac: 1, x64: 1,
    x86: 1, arm: 1, all: 1
  };

  function isVersionToken(token) {
    return /^v?\d+(\.\d+)*[a-z]?\d*$/i.test(token);
  }

  /** 文件名提炼搜索词：sodium-fabric-0.5.3+mc1.20.1.jar → sodium */
  function resQuery(name) {
    var base = String(name).replace(/\.disabled$/i, '').replace(/\.(jar|zip|litemod)$/i, '');
    var pieces = base.split(/[\s\-_.+()\[\]{},#]+/).filter(Boolean);
    var prefix = [];
    for (var i = 0; i < pieces.length; i++) {
      var token = pieces[i];
      if (isVersionToken(token) || RES_NOISE[token.toLowerCase()]) break;
      prefix.push(token);
    }
    var query = prefix.join(' ').trim();
    if (!query) {
      var rest = pieces.filter(function (token) {
        return !isVersionToken(token) && !RES_NOISE[token.toLowerCase()];
      });
      query = rest.join(' ').trim();
    }
    return query || base;
  }

  /** Modrinth 各项目类型对应的搜索页路径 */
  var MR_SEARCH_PATH = { mod: 'mods', resourcepack: 'resourcepacks', shader: 'shaders' };

  /** 还没解析出项目页时先给的兜底链接：站内搜索结果页，点开总能找到点东西 */
  function resFallbackUrl(query, mrType) {
    return 'https://modrinth.com/' + (MR_SEARCH_PATH[mrType] || 'mods') + '?q=' + encodeURIComponent(query);
  }

  var resResolveQueued = {};
  var resResolveTasks = [];
  var resResolveRunning = 0;

  function pumpResResolve() {
    while (resResolveRunning < 4 && resResolveTasks.length) {
      var task = resResolveTasks.shift();
      resResolveRunning++;
      task().catch(function () { /* 网络不通就留着搜索页兜底 */ }).then(function () {
        resResolveRunning--;
        pumpResResolve();
      });
    }
  }

  /** 按 Modrinth 搜索接口把文件名对到具体项目页，命中后原地把链接换过去 */
  function resolveResItem(item) {
    var key = item.mrType + ':' + item.name;
    if (resResolveQueued[key]) return;
    resResolveQueued[key] = true;
    resResolveTasks.push(function () {
      var query = resQuery(item.name);
      var facets = encodeURIComponent('[["project_type:' + item.mrType + '"]]');
      var url = 'https://api.modrinth.com/v2/search?limit=1&query=' + encodeURIComponent(query) + '&facets=' + facets;
      var timer;
      var controller = typeof AbortController === 'function' ? new AbortController() : null;
      if (controller) timer = setTimeout(function () { controller.abort(); }, 8000);
      return fetch(url, controller ? { signal: controller.signal } : undefined)
        .then(function (resp) { return resp.ok ? resp.json() : null; })
        .then(function (data) {
          var hit = data && Array.isArray(data.hits) && data.hits[0];
          if (!hit || !hit.slug) return;
          // 回包的项目类型就是站内路径段（mod / resourcepack / shader…），拿不准就按请求的类型
          var type = MR_SEARCH_PATH[hit.project_type] ? hit.project_type : item.mrType;
          var href = 'https://modrinth.com/' + type + '/' + encodeURIComponent(hit.slug);
          item.href = href;
          if (item.anchor) {
            item.anchor.setAttribute('href', href);
            item.anchor.setAttribute('title', hit.title || item.name);
          }
        })
        .then(function () { if (timer) clearTimeout(timer); });
    });
    pumpResResolve();
  }

  function closeResModal() {
    if (!resModal) return;
    if (resModalKeyHandler) document.removeEventListener('keydown', resModalKeyHandler);
    resModalKeyHandler = null;
    resModal.remove();
    resModal = null;
    document.body.classList.remove('join-modal-open');
    announce('');
    if (resModalReturnFocus) {
      try { resModalReturnFocus.focus(); } catch (e) { /* 元素可能已不在页面上 */ }
    }
    resModalReturnFocus = null;
  }

  function openResModal(groups, trigger) {
    closeResModal();

    var itemIndex = [];
    var groupsHtml = '';
    var total = 0;
    for (var gi = 0; gi < groups.length; gi++) {
      var group = groups[gi];
      total += group.names.length;
      var itemsHtml = '';
      for (var ii = 0; ii < group.names.length; ii++) {
        var name = String(group.names[ii]);
        var item = {
          name: name,
          mrType: group.mrType,
          href: resFallbackUrl(resQuery(name), group.mrType),
          anchor: null
        };
        itemIndex.push(item);
        itemsHtml +=
          '<a class="join-modal-item" target="_blank" rel="noopener" href="' + esc(item.href) + '">' +
            '<span class="join-modal-item-name">' + esc(name) + '</span>' +
            '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M19 13.5V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V8a1.5 1.5 0 0 1 1.5-1.5H12"/></svg>' +
          '</a>';
      }
      groupsHtml +=
        '<div class="join-modal-group">' +
          '<div class="join-modal-group-label">' + esc(group.label) + '<i>' + group.names.length + '</i></div>' +
          '<div class="join-modal-list">' + itemsHtml + '</div>' +
        '</div>';
    }

    resModal = document.createElement('div');
    resModal.className = 'join-modal';
    resModal.innerHTML =
      '<div class="join-modal-card" role="dialog" aria-modal="true" aria-labelledby="joinResTitle">' +
        '<div class="join-modal-head">' +
          '<h2 id="joinResTitle">房主的资源清单</h2>' +
          '<button type="button" class="join-modal-close" aria-label="关闭">' +
            '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12"/><path d="M18 6 6 18"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="join-modal-body">' + groupsHtml + '</div>' +
        '<p class="join-modal-foot">一共 ' + total + ' 个资源，来自房主创建分享链接时的实例；点名称打开它的 Modrinth 页面，没有精确匹配时会打开搜索结果。</p>' +
      '</div>';
    document.body.appendChild(resModal);
    document.body.classList.add('join-modal-open');

    var anchors = resModal.querySelectorAll('.join-modal-item');
    for (var ai = 0; ai < anchors.length; ai++) {
      itemIndex[ai].anchor = anchors[ai];
      resolveResItem(itemIndex[ai]);
    }

    var closeBtn = resModal.querySelector('.join-modal-close');
    closeBtn.addEventListener('click', closeResModal);
    // 点遮罩（卡片外面）也算关闭
    resModal.addEventListener('click', function (event) {
      if (event.target === resModal) closeResModal();
    });
    resModalKeyHandler = function (event) {
      if (event.key === 'Escape') closeResModal();
    };
    document.addEventListener('keydown', resModalKeyHandler);

    resModalReturnFocus = trigger || null;
    closeBtn.focus();
    announce('已打开房主资源清单，按 Esc 关闭');
  }

  function renderError(message) {
    document.title = '邀请链接打不开 · 方块盒子';
    panel.setAttribute('aria-busy', 'false');
    panel.innerHTML =
      '<div class="invite-error">' +
        '<span class="invite-error-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.4h.01"/></svg>' +
        '</span>' +
        '<h2>邀请链接打不开</h2>' +
        '<p>' + esc(message || '链接可能不完整或已过期，请让房主重新创建分享链接。') + '</p>' +
        '<div class="invite-error-actions">' +
          '<a class="btn btn-primary" href="' + DOWNLOAD_URL + '" target="_blank" rel="noopener">下载方块盒子</a>' +
          '<a class="btn btn-ghost" href="/lobby.html">去联机大厅看看</a>' +
        '</div>' +
      '</div>';
    if (steps) steps.setAttribute('hidden', '');
  }

  /** 房间号在服务器上已经没有了：房主结束联机 / 链接放太久 */
  function renderGone() {
    document.title = '联机可能已经结束 · 方块盒子';
    panel.setAttribute('aria-busy', 'false');
    panel.innerHTML =
      '<div class="invite-error">' +
        '<span class="invite-error-icon" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12.5A8 8 0 1 1 11.5 4"/><path d="M12 7.5V12l3 2"/></svg>' +
        '</span>' +
        '<h2>联机可能已经结束</h2>' +
        '<p>这个邀请对应的房间已经不在了：房主可能已经关掉联机，或者链接放太久失效了。请让房主重新创建一条分享链接再发给你。</p>' +
        '<div class="invite-error-actions">' +
          '<a class="btn btn-primary" href="/lobby.html">看看联机大厅</a>' +
          '<a class="btn btn-ghost" href="' + DOWNLOAD_URL + '" target="_blank" rel="noopener">下载方块盒子</a>' +
        '</div>' +
      '</div>';
    if (steps) steps.setAttribute('hidden', '');
    announce('联机可能已经结束');
  }

  // 新式短链接：链接里只有一段房间号，房间信息现从论坛服务器取。
  // 房主结束联机后服务端的数据会删掉，这时给出「联机可能已经结束」而不是一句报错。
  var token = shareParam();
  if (token) {
    panel.setAttribute('aria-busy', 'true');
    fetchShare(token).then(function (share) {
      render(share, 'r=' + encodeURIComponent(token));
    }, function (error) {
      if (error && error.gone) {
        renderGone();
        return;
      }
      renderError('暂时连不上论坛服务器，刷新一下再试试。');
    });
    return;
  }

  // 老式链接：房间信息压缩在 ?d= 载荷里，仍然照旧解开
  var param = payloadParam();
  if (!param) {
    renderError('链接里没有房间信息，请让房主重新创建分享链接。');
    return;
  }

  decodePayload(param).then(function (data) {
    render(data, 'd=' + encodeURIComponent(param));
  }, function (error) {
    renderError(error && error.message ? error.message : '邀请内容解析失败。');
  });
})();
</script>
</body>
</html>
