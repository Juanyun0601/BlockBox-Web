<!DOCTYPE html>

<script>
  (function () {
    try {
      var saved = localStorage.getItem('bbf-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  })();
</script>

    <div id="editHost"></div>

    <div class="card" style="margin-top: 16px">
      <div class="toolbar">
        <div class="tabs" id="userTabs"></div>
        <span class="small muted" id="listHint" style="margin-left: auto"></span>
      </div>
      <div id="userContent">
        <div class="skeleton">正在加载…</div>
      </div>
    </div>

    <div id="pager"></div>
  </div>
