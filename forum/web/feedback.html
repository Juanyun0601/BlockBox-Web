<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>意见反馈 · 方块盒子论坛</title>
<meta name="description" content="向方块盒子反馈软件使用中遇到的问题与建议">
<link rel="icon" href="/assets/img/icon.ico">
<link rel="stylesheet" href="/assets/forum.css?v=20261107a">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('bbf-theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (e) {}
  })();
</script>
</head>
<body data-page="feedback">
<div id="siteNav"></div>

<main class="page">
  <div class="wrap" style="max-width: 780px">
    <div class="section-head">
      <h2>意见反馈</h2>
      <span class="small muted">软件使用中遇到问题？在这里告诉我们</span>
    </div>

    <div class="card" id="feedbackLoginCard" style="display: none">
      <div class="empty">登录后才能提交反馈，处理进度也会展示在你的反馈列表里。<br><br>
        <a class="btn btn-primary btn-sm" href="/login.html?next=%2Ffeedback.html">去登录</a></div>
    </div>

    <div class="card" id="feedbackFormCard" style="display: none">
      <div class="field">
        <label>反馈类型 <span class="req">*</span></label>
        <div class="feedback-tpl" id="feedbackType">
          <button type="button" class="btn btn-primary btn-sm" data-type="bug">🐛 问题反馈</button>
          <button type="button" class="btn btn-ghost btn-sm" data-type="feature">💡 功能建议</button>
        </div>
      </div>
      <div class="field" id="fieldAppVersion">
        <label for="feedbackAppVersion">启动器版本 <span class="req">*</span></label>
        <input class="input" id="feedbackAppVersion" maxlength="40" placeholder="例如 beta6">
        <div class="input-hint">在「设置 → 关于」里能看到版本号</div>
      </div>
      <div class="field" id="fieldPlatform">
        <label for="feedbackPlatform">运行平台 <span class="req">*</span></label>
        <select class="select" id="feedbackPlatform">
          <option value="Windows（x64）">Windows（x64）</option>
          <option value="Windows（ARM64）">Windows（ARM64）</option>
          <option value="Android">Android</option>
          <option value="鸿蒙 HarmonyOS">鸿蒙 HarmonyOS</option>
          <option value="其他">其他（请在问题描述里说明）</option>
        </select>
      </div>
      <div class="field" id="fieldOsVersion">
        <label for="feedbackOsVersion">系统版本（可选）</label>
        <input class="input" id="feedbackOsVersion" maxlength="100" placeholder="例如 Windows 11 23H2 / Android 14">
      </div>
      <div class="field">
        <label for="feedbackDesc"><span id="descLabel">问题描述</span> <span class="req">*</span></label>
        <textarea class="textarea" id="feedbackDesc" maxlength="800" style="min-height: 90px"
          placeholder="说说发生了什么，涉及哪个页面、哪个实例，越具体越好。"></textarea>
      </div>
      <div class="field" id="fieldSteps">
        <label for="feedbackSteps">复现步骤 <span class="req">*</span></label>
        <textarea class="textarea" id="feedbackSteps" maxlength="800" style="min-height: 90px">1. 
2. 
3. </textarea>
        <div class="input-hint">按顺序写下你点过哪些地方，方便照着再试一遍</div>
      </div>
      <div class="field" id="fieldExpected">
        <label for="feedbackExpected">期望结果（可选）</label>
        <textarea class="textarea" id="feedbackExpected" maxlength="400" style="min-height: 64px"
          placeholder="例如：安装完成后自动打开新实例。"></textarea>
      </div>
      <div class="field" id="fieldActual">
        <label for="feedbackActual">实际结果（可选）</label>
        <textarea class="textarea" id="feedbackActual" maxlength="400" style="min-height: 64px"
          placeholder="如果有报错弹窗，把提示文字原样贴进来。"></textarea>
      </div>
      <div class="field" id="fieldLogs">
        <label for="feedbackLogs">日志（可选）</label>
        <textarea class="textarea" id="feedbackLogs" maxlength="2000" style="min-height: 80px"
          placeholder="在「设置 → 高级设置 → 运行日志」里导出；很长时贴最后几十行就可以。"></textarea>
      </div>
      <div class="field" id="fieldScreenshots">
        <label for="feedbackScreenshots">截图 / 录屏（可选）</label>
        <textarea class="textarea" id="feedbackScreenshots" maxlength="500" style="min-height: 64px"
          placeholder="图片链接或文字说明。"></textarea>
      </div>
      <div class="field" id="fieldScene" style="display: none">
        <label for="feedbackScene">使用场景（可选）</label>
        <textarea class="textarea" id="feedbackScene" maxlength="800" style="min-height: 90px"
          placeholder="什么时候会用到、能解决什么问题"></textarea>
      </div>
      <div class="input-hint" id="feedbackError" style="display: none; color: var(--danger)"></div>
      <button class="btn btn-primary" id="feedbackSubmit" style="margin-top: 6px">提交反馈</button>
    </div>

    <div class="section-head" id="mineHead" style="display: none; margin-top: 24px">
      <h2>我的反馈</h2>
      <button class="btn btn-ghost btn-sm" id="feedbackRefresh" style="margin-left: auto">刷新</button>
    </div>

    <div class="card" id="mineList">
      <div class="skeleton">正在加载…</div>
    </div>

    <div id="pager"></div>

    <div class="section-head" style="margin-top: 28px">
      <h2>全部反馈</h2>
      <span class="small muted">大家提交的反馈都在这里，点一条可以看详情</span>
    </div>

    <div class="card" id="allListCard">
      <div class="fb-tabs" id="allTabs"></div>
      <div id="allList">
        <div class="skeleton">正在加载…</div>
      </div>
    </div>

    <div id="allPager"></div>
  </div>
</main>

<footer class="footer" id="siteFooter"></footer>
<script src="/assets/core.js?v=20261107a"></script>
<script src="/assets/page-feedback.js?v=20261105a"></script>
</body>
</html>
