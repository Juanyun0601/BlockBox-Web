# 方块盒子论坛 · Nginx 反向代理示例
# 放到 /etc/nginx/conf.d/forum.conf，然后 nginx -t && systemctl reload nginx
# 证书可以用 certbot：certbot --nginx -d forum.blockbox.cc.cd

upstream blockbox_forum {
    server 127.0.0.1:3210;
    keepalive 16;
}

server {
    listen 80;
    server_name forum.blockbox.cc.cd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forum.blockbox.cc.cd;

    ssl_certificate     /etc/letsencrypt/live/forum.blockbox.cc.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.blockbox.cc.cd/privkey.pem;

    # 图片上传上限（和 .env 里的 MAX_IMAGE_BYTES 对齐）
    client_max_body_size 5m;

    # 静态资源让浏览器多缓存，文件名带 ?v= 版本号，改版后自动失效
    location /assets/ {
        proxy_pass http://blockbox_forum;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://blockbox_forum;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
