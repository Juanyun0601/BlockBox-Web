# 方块盒子论坛 · Nginx 反向代理示例
# 放到 /etc/nginx/conf.d/forum.conf，然后 nginx -t && systemctl reload nginx
# 证书可以用 certbot：certbot --nginx -d forum.blockbox.cc.cd

upstream blockbox_forum {
    server 127.0.0.1:3210;
    keepalive 16;
}

server {
    listen 80;
    server_name forum.blockbox.cc.cd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forum.blockbox.cc.cd;

    ssl_certificate     /etc/letsencrypt/live/forum.blockbox.cc.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.blockbox.cc.cd/privkey.pem;

    # 请求体上限要按「最大的那一类上传」定：帖子图片 4 MB、封面 3 MB、插件包 20 MB，
    # 最大的是后台上传的安装包（.env 的 MAX_RELEASE_FILE_BYTES，默认 300 MB），
    # 所以这里给 320m 留余量。只按图片的 5m 配，传图正常但传安装包会 413。
    # 其它接口各自的限制仍由程序自己把守，这一行只是放行。
    client_max_body_size 320m;

    # 静态资源让浏览器多缓存，文件名带 ?v= 版本号，改版后自动失效
    location /assets/ {
        proxy_pass http://blockbox_forum;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://blockbox_forum;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
