# 公开资源 CDN 域名：cdn.mcblockbox.top
# 80 端口：保留 ACME 验证，并直接回源（很多 CDN 面板的「回源协议」选 http）
# 443 端口：给选了 https 回源的面板用，证书是 Let's Encrypt 的 cdn 证书
server {
    listen 80;
    listen [::]:80;
    server_name cdn.mcblockbox.top;

    location /.well-known/acme-challenge/ {
        root /var/www/blockbox;
    }

    location / {
        proxy_pass http://blockbox_forum;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.mcblockbox.top;

    ssl_certificate     /etc/letsencrypt/live/cdn.mcblockbox.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.mcblockbox.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://blockbox_forum;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/cdn.access.log;
    error_log  /var/log/nginx/cdn.error.log;
}
